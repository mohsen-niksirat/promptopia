<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>۴۰۴ · پرامپتوپیا</title>
<meta http-equiv="refresh" content="5; url=./">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #07080d; color: #eef0f6;
    font-family: Vazirmatn, 'Segoe UI', Tahoma, system-ui, sans-serif;
    text-align: center; padding: 24px;
    overflow: hidden;
  }
  .glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(420px 320px at 20% 10%, rgba(124, 58, 237, .18), transparent 70%),
      radial-gradient(480px 360px at 85% 90%, rgba(217, 70, 239, .14), transparent 70%);
  }
  .card { position: relative; z-index: 1; max-width: 420px; }
  .logo {
    width: 62px; height: 62px; border-radius: 18px; margin: 0 auto 20px;
    box-shadow: 0 8px 30px rgba(217, 70, 239, .45);
    animation: pop .5s cubic-bezier(.34, 1.56, .64, 1) backwards;
  }
  h1 { font-size: 3rem; margin: 0; font-weight: 900; letter-spacing: -.02em;
    background: linear-gradient(120deg, #8b5cf6, #d946ef, #fb923c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { color: #9aa1b5; margin: 10px 0 26px; line-height: 1.9; }
  a.btn {
    display: inline-block; padding: 12px 26px; border-radius: 14px;
    background: linear-gradient(120deg, #8b5cf6, #d946ef, #fb923c);
    color: #fff; text-decoration: none; font-weight: 700;
    box-shadow: 0 10px 26px rgba(217, 70, 239, .35);
    transition: transform .2s;
  }
  a.btn:hover { transform: translateY(-2px); }
  .hint { font-size: .78rem; margin-top: 16px; opacity: .6; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="card">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7c3aed"/><stop offset=".55" stop-color="#d946ef"/><stop offset="1" stop-color="#f59e0b"/>
      </linearGradient></defs>
      <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lg)"/>
      <path d="M22 20l14 12-14 12" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="44" cy="44" r="4" fill="#fff"/>
    </svg>
    <h1>۴۰۴</h1>
    <p>این صفحه پیدا نشد — اما صدها پرامپت آماده منتظرت هستند.</p>
    <a class="btn" href="./">بازگشت به گالری</a>
    <p class="hint">تا چند ثانیه دیگر به‌صورت خودکار منتقل می‌شوی…</p>
  </div>
  <script>setTimeout(function () { location.replace('./'); }, 5000);</script>
</body>
</html>
